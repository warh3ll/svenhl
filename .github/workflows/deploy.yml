name: Sync data and deploy

on:
  # Data refresh every 30 minutes. GitHub often delays or skips scheduled runs,
  # so the follow-up job below also chains runs itself while games are updating.
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Never run two syncs at the same time
    concurrency:
      group: sync
      cancel-in-progress: false
    outputs:
      pending_games: ${{ steps.pending.outputs.games }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Carry over game state (cached highlight video IDs) from the live site.
      # Falls back to the committed public/data/games.json if the site is unreachable.
      - name: Restore game state from live site
        run: |
          if curl -fsSL https://svenhl.com/data/games.json -o /tmp/games.json \
            && node -e 'if (!Array.isArray(JSON.parse(require("fs").readFileSync("/tmp/games.json", "utf8")))) process.exit(1)'; then
            mv /tmp/games.json public/data/games.json
            echo "Restored games.json from live site"
          else
            echo "Live games.json unavailable, using committed copy"
          fi

      # Same for the season's Impact records (games already checked), so they aren't fetched again
      - name: Restore Impact records from live site
        run: |
          season=$(curl -fsSL https://svenhl.com/data/manifest.json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).currentSeason || "")') || season=""
          if [ -n "$season" ] && curl -fsSL "https://svenhl.com/data/impact-$season.json" -o /tmp/impact.json \
            && node -e 'if (!Array.isArray(JSON.parse(require("fs").readFileSync("/tmp/impact.json", "utf8")).checked)) process.exit(1)'; then
            mv /tmp/impact.json "public/data/impact-$season.json"
            echo "Restored impact-$season.json from live site"
          else
            echo "Live Impact records unavailable, using committed copy"
          fi

      - name: Sync NHL data
        run: node scripts/sync.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # Games starting soon, live, or finished in the last 12 hours without a highlight video
      - name: Check for games still updating
        id: pending
        run: |
          node -e '
            const games = JSON.parse(require("fs").readFileSync("public/data/games.json", "utf8"));
            const now = Date.now();
            const pending = games.filter((g) => {
              const start = Date.parse(g.game_date);
              return start < now + 60 * 60 * 1000 && start > now - 12 * 60 * 60 * 1000 &&
                !(g.status === "final" && g.highlight_video_id);
            });
            console.log(`${pending.length} games still updating`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `games=${pending.length}\n`);
          '

      - run: npm run build

      - name: Write route pages
        run: node scripts/prerender-routes.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub skips most scheduled runs (real gaps of 3-7 hours), so while games are live or
  # waiting for highlight videos, each run starts the next one itself 20 minutes later.
  # The chain stops on its own once every recent game is final with a video.
  follow-up:
    needs: [build, deploy]
    if: fromJSON(needs.build.outputs.pending_games || '0') > 0
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: sleep 1200
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
